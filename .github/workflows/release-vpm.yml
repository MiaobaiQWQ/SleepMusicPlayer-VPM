name: Build & Publish VPM Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-vpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build VPM Zip & Update Listing
        id: pkg
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile

          pkg_id = "com.miaobai.sleep-music-player"
          pkg_dir = os.path.join("Packages", pkg_id)
          os.makedirs("dist", exist_ok=True)
          os.makedirs("docs", exist_ok=True)

          with open(os.path.join(pkg_dir, "package.json"), "r", encoding="utf-8") as f:
              pkg = json.load(f)

          version = pkg["version"]
          is_prerelease = "-" in version
          zip_name = f"{pkg_id}-{version}.zip"
          zip_path = os.path.join("dist", zip_name)

          exclude_dirs = {"tests", "test", "scratch", "__pycache__", ".git"}
          exclude_exts = {".tmp", ".bak", ".log", ".pyc"}
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(pkg_dir):
                  dirs[:] = [d for d in dirs if d.lower() not in exclude_dirs]
                  for fn in sorted(files):
                      low = fn.lower()
                      if low in {".ds_store", "thumbs.db"} or any(low.endswith(ext) for ext in exclude_exts):
                          continue
                      if "test" in low and (low.endswith(".cs") or low.endswith(".cs.meta")):
                          continue
                      full = os.path.join(root, fn)
                      rel = os.path.relpath(full, pkg_dir).replace("\\", "/")
                      zf.write(full, rel)

          h = hashlib.sha256()
          with open(zip_path, "rb") as f:
              for chunk in iter(lambda: f.read(65536), b""):
                  h.update(chunk)
          digest = h.hexdigest()

          owner = os.environ.get("GITHUB_REPOSITORY_OWNER", "vrc-lpos")
          repo = os.environ.get("GITHUB_REPOSITORY", "vrc-lpos/SleepMusicPlayer-VPM").split("/")[-1]
          listing_url = f"https://{owner.lower()}.github.io/{repo}/index.json"
          download_url = f"https://github.com/{owner}/{repo}/releases/download/v{version}/{zip_name}"

          index_path = os.path.join("docs", "index.json")
          if os.path.exists(index_path):
              with open(index_path, "r", encoding="utf-8") as f:
                  index_data = json.load(f)
          else:
              index_data = {
                  "name": "SleepMusic VPM Listing",
                  "id": f"com.{owner.lower()}.sleep-music-vpm",
                  "url": listing_url,
                  "author": owner,
                  "packages": {},
              }

          index_data["url"] = listing_url
          entry = dict(pkg)
          entry["url"] = download_url
          entry["zipSHA256"] = digest
          index_data.setdefault("packages", {}).setdefault(pkg_id, {"versions": {}})
          index_data["packages"][pkg_id]["versions"][version] = entry

          with open(index_path, "w", encoding="utf-8", newline="\n") as f:
              json.dump(index_data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          html = f"""<!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>SleepMusic Player · VPM 镜像源</title>
          <style>body{{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111318;color:#ece8e1;display:flex;align-items:center;justify-content:center;min-height:100vh}}.card{{max-width:560px;width:90%;background:rgba(28,31,38,.92);border:1px solid rgba(242,184,112,.28);border-radius:20px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.5)}}h1{{margin:0 0 8px;font-size:24px;color:#f6cfa0}}p{{color:#b8b3aa;line-height:1.6;font-size:14px}}.btn{{display:inline-block;margin-top:16px;padding:12px 24px;background:#e5a95c;color:#15171c;font-weight:700;text-decoration:none;border-radius:999px}}code{{display:block;margin-top:16px;padding:12px;background:#0b0d11;border-radius:10px;font-size:12px;word-break:break-all;color:#d8d3ca}}</style>
          </head><body><div class="card"><h1>SleepMusic Player · VPM 镜像源</h1>
          <p>支持任意 VRChat 视频播放器的通用 GPU 音乐歌词与弹幕舞台（正式版），内置 GPU BC1 封面解码、无重影流体背景、真逐字歌词、曲面屏自适应与拖拽自动绑定。</p>
          <p>最新测试版：<b>v{version}</b></p>
          <a class="btn" href="vcc://vpm/addRepo?url={listing_url}">一键添加到 VCC / ALCOM</a>
          <code>{listing_url}</code></div></body></html>
          """
          with open(os.path.join("docs", "index.html"), "w", encoding="utf-8", newline="\n") as f:
              f.write(html)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"prerelease={'true' if is_prerelease else 'false'}\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: SleepMusic Player v${{ steps.pkg.outputs.version }} (Beta)
          files: dist/com.miaobai.sleep-music-player-${{ steps.pkg.outputs.version }}.zip
          prerelease: true
          generate_release_notes: true

      - name: Commit updated docs/index.json & docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json docs/index.html
          git diff --staged --quiet || git commit -m "chore(vpm): 自动更新 v${{ steps.pkg.outputs.version }} 镜像索引"
          git push origin HEAD:main || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy VPM Listing to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
