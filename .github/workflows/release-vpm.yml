name: Build & Publish VPM Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-vpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build VPM Zip & Update Listing
        run: python scripts/build_vpm_release.py

      - name: Read package version
        id: pkg
        run: |
          VER=$(python -c "import json; print(json.load(open('Packages/com.miaobai.sleep-music-player/package.json', encoding='utf-8'))['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: SleepMusic Player v${{ steps.pkg.outputs.version }}
          files: dist/com.miaobai.sleep-music-player-${{ steps.pkg.outputs.version }}.zip
          generate_release_notes: true

      - name: Commit updated docs/index.json & docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json docs/index.html
          git diff --staged --quiet || git commit -m "chore(vpm): update listing for v${{ steps.pkg.outputs.version }}"
          git push origin HEAD:main || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy VPM Listing to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
